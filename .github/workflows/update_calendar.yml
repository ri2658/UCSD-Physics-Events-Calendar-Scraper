name: Update physics calendar

on:
  schedule:
    - cron: "17 13 * * *"     # once a day, 13:17 UTC (~6am Pacific). Be polite: no need to scrape more often.
  workflow_dispatch:           # adds a "Run workflow" button for manual runs

permissions:
  contents: write              # lets the job commit physics.ics back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests pandas beautifulsoup4 icalendar

      - run: python scrape_events.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add physics.ics events_archive.csv
          git diff --cached --quiet || git commit -m "Update events $(date -u +%F)"
          git push